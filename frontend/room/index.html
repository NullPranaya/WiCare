<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WiCare · Room view</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ward: #E8EEF0; --sheet: #F7FAFB; --ink: #15232C; --quiet: #5E717B;
      --trace: #0E7A80; --burst: #B9770E; --fall: #C0262D; --line: #CBD6DB;
      font-family: "Atkinson Hyperlegible", system-ui, sans-serif; color: var(--ink); background: var(--ward);
      font-variant-numeric: tabular-nums;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #101a2c; }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .top { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;
      padding: 1rem 2rem; background: var(--sheet); border-bottom: 1px solid var(--line); z-index: 2; }
    .top h1 { margin: 0; font-size: 1.5rem; font-weight: 700; }
    .room { font-weight: 400; color: var(--quiet); margin-left: .5rem; }
    .back { margin-left: auto; font-size: 1.05rem; color: var(--ink); }
    .panel { position: fixed; left: 2rem; bottom: 1.5rem; z-index: 2; background: var(--sheet); border: 1px solid var(--line);
      border-radius: 6px; padding: 1rem 1.25rem; max-width: calc(100% - 4rem); }
    .now { margin: 0; font-size: clamp(1.8rem, 4vw, 2.8rem); font-weight: 700; line-height: 1.05; }
    .now[data-tone="fall"] { color: var(--fall); }
    .now[data-tone="move"] { color: var(--burst); }
    .steps { display: flex; flex-wrap: wrap; gap: .25rem; list-style: none; margin: .75rem 0 0; padding: 0; }
    .steps li { padding: .35rem .8rem; border-radius: 999px; color: var(--quiet); border: 1px solid transparent; font-size: .95rem; }
    .steps li.active { color: var(--ink); border-color: var(--ink); font-weight: 700; }
    .steps li.active[data-k="fall"], .steps li.active[data-k="floor"] { color: var(--fall); border-color: var(--fall); }
    .note { margin: .6rem 0 0; color: var(--quiet); font-size: .9rem; }
    @media (max-width: 800px) { .top { padding: .75rem 1rem; } .panel { left: 1rem; right: 1rem; bottom: 1rem; max-width: none; } }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <header class="top">
    <h1>WiCare <span class="room">Bed 1 · room view</span></h1>
    <a class="back" href="/">Back to dashboard</a>
  </header>
  <section class="panel" aria-live="polite">
    <p id="now" class="now">Standing</p>
    <ol class="steps">
      <li data-k="standing">Standing</li>
      <li data-k="fall">Fall</li>
      <li data-k="floor">On the floor</li>
    </ol>
    <p class="note">Drag to turn the room, scroll to zoom.</p>
  </section>
  <script type="importmap">
  { "imports": { "three": "../vendor/three/build/three.module.js", "three/addons/": "../vendor/three/examples/jsm/" } }
  </script>
  <script type="module" src="room.js"></script>
</body>
</html>
