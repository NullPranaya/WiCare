<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WiCare · Room view</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link id="favicon" rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#0E7A80">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <h1>WiCare <span class="room">Bed 1</span></h1>
    <a class="back" href="/">Back to dashboard</a>
  </header>

  <main>
    <section class="status">
      <p class="status-word">Room view</p>
      <p class="status-note">The nurse acknowledged the fall. The 3D view of the room with the patient's position will appear here.</p>
    </section>
    <section id="room-view" class="trace room-view" aria-label="Room view"></section>
  </main>
</body>
</html>
